<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="#121110" />
  <rect x="8" y="8" width="496" height="496" rx="88" fill="none" stroke="#2A2723" stroke-width="4" />
  <rect x="24" y="24" width="464" height="464" rx="72" fill="none" stroke="#3D3425" stroke-width="2" stroke-opacity="0.6" />

  <!-- Monogram B (Architectural Serif + Momentum Spark) -->
