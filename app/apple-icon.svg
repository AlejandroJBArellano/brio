      d="M 168 252 L 308 252 C 374 252, 416 288, 416 348 C 416 406, 368 412, 296 412 L 168 412 L 168 372 L 286 372 C 334 372, 368 362, 368 348 C 368 312, 334 292, 286 292 L 168 292 Z"
