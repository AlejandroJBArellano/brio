<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ambient Gold Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Radial Background Depth -->
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#241E16" />
      <stop offset="100%" stop-color="#121110" />
    </radialGradient>

    <!-- Right/Main Facet Gradient (Luminous Gold & Ivory) -->
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DF" />
      <stop offset="35%" stop-color="#F5CE78" />
      <stop offset="100%" stop-color="#D99B43" />
    </linearGradient>

    <!-- Left Facet Gradient (Rich Bronze Amber Depth) -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2A64D" />
      <stop offset="60%" stop-color="#B87B28" />
      <stop offset="100%" stop-color="#7A4E13" />
    </linearGradient>

    <!-- Inner Core Spark Gradient -->
    <linearGradient id="sparkLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FCEFD2" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect x="10" y="10" width="492" height="492" rx="102" fill="none" stroke="#2A2723" stroke-width="3" />
  <rect x="26" y="26" width="460" height="460" rx="86" fill="none" stroke="#3D3425" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- Corner Precision Ticks (Archival Cockpit Aesthetic) -->
  <circle cx="52" cy="52" r="3.5" fill="#D99B43" opacity="0.45" />
  <circle cx="460" cy="52" r="3.5" fill="#D99B43" opacity="0.45" />
  <circle cx="52" cy="460" r="3.5" fill="#D99B43" opacity="0.45" />
  <circle cx="460" cy="460" r="3.5" fill="#D99B43" opacity="0.45" />

  <!-- Subtle Ambient Shadow/Glow under Rayito -->
  <polygon
    points="288,88 172,268 244,268 218,424 340,244 268,244"
    fill="#D99B43"
    opacity="0.22"
    filter="url(#glow)"
  />

  <!-- Main Lightning Bolt (Rayito) -->
  <g id="rayito">
    <!-- Left / Shaded Facet -->
    <path
      d="M 288 88 L 172 268 L 244 268 L 218 424 L 253 256 Z"
      fill="url(#goldDark)"
    />

    <!-- Right / Highlight Facet -->
    <path
      d="M 288 88 L 253 256 L 218 424 L 340 244 L 268 244 Z"
      fill="url(#goldBright)"
    />

    <!-- Razor-Sharp Spine Ridge (Center Bevel Highlight) -->
    <line
      x1="288"
      y1="88"
      x2="218"
      y2="424"
      stroke="#FFFDF7"
      stroke-width="2"
      stroke-linecap="round"
      opacity="0.8"
    />

    <!-- Precision Spark Centerpiece -->
    <polygon
      points="253,244 262,256 253,268 244,256"
      fill="url(#sparkLight)"
      opacity="0.9"
    />
  </g>
</svg>